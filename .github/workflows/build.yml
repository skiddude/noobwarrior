name: Build (MinGW g++ / Qt5)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MinGW (g++)
      uses: egor-tisin/setup-mingw@v2
      with:
        version: '12.2.0'

    - name: Install Qt 5.15.2
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw81'
        modules: 'qtmultimedia'

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11

    - name: Configure CMake
      run: >
        cmake -B build -G "Ninja"
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_C_COMPILER=gcc
        -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
        -DCMAKE_PREFIX_PATH="${{ env.Qt5_DIR }}"

    - name: Build project
      run: cmake --build build --config Release

    - name: Deploy Qt Dependencies
      run: windeployqt --compiler-runtime build/Release/your_executable_name.exe

    - name: Upload Windows 8.1 Compatible Build
      uses: actions/upload-artifact@v4
      with:
        name: win81-mingw-build
        path: build/Release/
